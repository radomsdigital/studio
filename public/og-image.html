<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1200px;
            height: 630px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            position: relative;
        }
        .og-container {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 50%, #1e3a8a 100%);
            display: flex;
            position: relative;
            overflow: hidden;
        }
        .left-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 80px;
            z-index: 2;
        }
        .logo-container {
            margin-bottom: 40px;
        }
        .logo {
            width: 180px;
            height: auto;
            filter: brightness(0) invert(1);
        }
        .title {
            font-size: 52px;
            font-weight: 800;
            color: white;
            line-height: 1.2;
            margin-bottom: 20px;
        }
        .subtitle {
            font-size: 28px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.4;
            margin-bottom: 30px;
        }
        .features {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .feature {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-size: 18px;
        }
        .check-icon {
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .right-section {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .contractor-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #2563eb 0%, rgba(37, 99, 235, 0) 100%);
            z-index: 1;
        }
        .decorative-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
        }
        .circle-1 {
            width: 400px;
            height: 400px;
            background: white;
            top: -100px;
            right: -100px;
        }
        .circle-2 {
            width: 300px;
            height: 300px;
            background: white;
            bottom: -80px;
            left: -80px;
        }
    </style>
</head>
<body>
    <div class="og-container">
        <div class="decorative-circle circle-1"></div>
        <div class="decorative-circle circle-2"></div>
        
        <div class="left-section">
            <div class="logo-container">
                <img src="./leywok_logo.png" alt="Leywok" class="logo">
            </div>
            
            <h1 class="title">Post a Task,<br>Get It Done.</h1>
            
            <p class="subtitle">Connect with skilled professionals for any service</p>
            
            <div class="features">
                <div class="feature">
                    <div class="check-icon">✓</div>
                    <span>Verified Professionals</span>
                </div>
                <div class="feature">
                    <div class="check-icon">✓</div>
                    <span>Secure Payments</span>
                </div>
                <div class="feature">
                    <div class="check-icon">✓</div>
                    <span>Satisfaction Guaranteed</span>
                </div>
            </div>
        </div>
        
        <div class="right-section">
            <div class="overlay"></div>
            <img src="./contractor.jpg" alt="Professional Contractor" class="contractor-image">
        </div>
    </div>
</body>
</html>
